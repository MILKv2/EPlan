# Tag v* → tests → signed APK → GitHub Release.
# Secrets: KEYSTORE_BASE64 (base64 .jks), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
name: Android release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          QBIT_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          QBIT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          QBIT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          QBIT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          QBIT_VERSION_NAME: ${{ github.ref_name }}
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "E-Plan-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: android/E-Plan-${{ github.ref_name }}.apk
          generate_release_notes: true
