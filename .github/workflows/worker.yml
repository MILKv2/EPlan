# Push do main ze zmianami w worker/** → wrangler deploy.
# Wymagane sekrety repo: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Klucz FCM NIE trafia tutaj: ustawia się go raz przez `wrangler secret put`.
name: Worker deploy

on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Do etapu 2 w worker/ jest tylko README, więc nie ma czego wdrażać.
      - name: Sprawdź, czy worker istnieje
        id: check
        run: |
          if [ -f worker/wrangler.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; \
          else echo "Brak worker/wrangler.toml, pomijam deploy."; fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: "22"

      - name: Instalacja i testy
        if: steps.check.outputs.present == 'true'
        working-directory: worker
        run: |
          npm ci
          npm test --if-present

      - uses: cloudflare/wrangler-action@v3
        if: steps.check.outputs.present == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
