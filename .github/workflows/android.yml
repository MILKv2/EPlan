# A versionName bump in android/version.properties merged to main → tests → signed APK
# → GitHub Release v<versionName> (the tag is created here). The signed Play bundle (AAB) is
# kept as a run artifact for upload in Play Console. Re-run by hand with "Run workflow"
# if a run failed; a version that already has a tag is skipped.
# Secrets: KEYSTORE_BASE64 (base64 .jks), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
name: Android release

on:
  push:
    branches: [main]
    paths: ["android/version.properties"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          name=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error file=android/version.properties::versionName '$name' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          tag="v$name"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::notice::$tag is already released, nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.exists != 'true'

      - name: Restore keystore
        if: steps.version.outputs.exists != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing; an unsigned APK can't update installed apps"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        if: steps.version.outputs.exists != 'true'
        env:
          QBIT_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          QBIT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          QBIT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          QBIT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :core:test :app:testGithubDebugUnitTest :app:assembleGithubRelease :app:bundlePlayRelease

      - name: Rename APK and AAB
        if: steps.version.outputs.exists != 'true'
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk "E-Plan-${{ steps.version.outputs.tag }}.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "E-Plan-${{ steps.version.outputs.tag }}.aab"

      # Not a release asset: users install the APK; the bundle goes to Play Console.
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.exists != 'true'
        with:
          name: play-bundle-${{ steps.version.outputs.tag }}
          path: android/E-Plan-${{ steps.version.outputs.tag }}.aab
          retention-days: 90

      # The app's update check reads the newest non-draft release and its .apk asset.
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.exists != 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          files: android/E-Plan-${{ steps.version.outputs.tag }}.apk
          generate_release_notes: true
