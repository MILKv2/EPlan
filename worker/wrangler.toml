name = "qbitplan"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Substitutions are checked every 5 minutes (UTC cron; the worker uses Polish dates itself).
[triggers]
crons = ["*/5 * * * *"]

# Fingerprints of the watched days. Created in the Cloudflare dashboard (Workers & Pages → KV).
[[kv_namespaces]]
binding = "STATE"
id = "00000000000000000000000000000000"

[observability]
enabled = true

# Secret, set in the dashboard or with `npx wrangler secret put FCM_SERVICE_ACCOUNT`:
#   FCM_SERVICE_ACCOUNT – the Firebase service account JSON
