name = "qbitplan"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Runs only on the cron; it serves no HTTP, so no public workers.dev or preview URLs
# (set here, since every deploy would turn them back on).
workers_dev = false
preview_urls = false

# Substitutions are checked every 5 minutes (UTC cron; the worker uses Polish dates itself).
[triggers]
crons = ["*/5 * * * *"]

# Fingerprints of the watched days. Created in the Cloudflare dashboard (Workers & Pages → KV).
[[kv_namespaces]]
binding = "STATE"
id = "0427eecd0c9f4f29bd6134130c8a1afb"

[observability]
enabled = true

# Secret, set in the dashboard or with `npx wrangler secret put FCM_SERVICE_ACCOUNT`:
#   FCM_SERVICE_ACCOUNT – the Firebase service account JSON
