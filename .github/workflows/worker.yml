# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. The FCM key is set once with `wrangler secret put`.
name: Worker deploy

on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check worker exists
        id: check
        run: |
          if [ -f worker/wrangler.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; \
          else echo "No worker/wrangler.toml, skipping deploy."; fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: "22"

      - name: Install and test
        if: steps.check.outputs.present == 'true'
        working-directory: worker
        run: |
          npm ci
          npm test --if-present

      - uses: cloudflare/wrangler-action@v3
        if: steps.check.outputs.present == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
