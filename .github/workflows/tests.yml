# Once per PR, not on every push: when it is opened (or reopened, or marked ready), and when the
# "run tests" label is added to test new commits. "Run workflow" runs it on any branch by hand.
# Pushes to main don't run it again: the PR was tested, and a release runs the tests itself.
name: Tests

on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]
    paths: ["android/**", "worker/**", "fixtures/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    if: github.event_name == 'workflow_dispatch' || (!github.event.pull_request.draft && (github.event.action != 'labeled' || github.event.label.name == 'run tests'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Record mode also writes every screen as a PNG, kept as the "screenshots" artifact for review.
      - name: Unit tests
        run: ./gradlew --no-daemon :core:test :app:testGithubDebugUnitTest -Proborazzi.record=true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: android/app/build/screenshots/
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/*/build/reports/tests/
          retention-days: 7

  # The worker deploys itself through Cloudflare's Git integration; this only tests it.
  worker-tests:
    if: github.event_name == 'workflow_dispatch' || (!github.event.pull_request.draft && (github.event.action != 'labeled' || github.event.label.name == 'run tests'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
